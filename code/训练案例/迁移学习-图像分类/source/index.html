<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>demo</title>
  <script src="./tf.min.js" module></script>
  <script src="./tfjs-vis.umd.min.js"></script>
</head>
<body>
  <h1>迁移学习-图像分类</h1>
  <!-- 上传图片 -->
  <input type="file" onchange="window.pridict(this.files[0])">
  <script type="module">
    // 导入训练数据处理函数
    import { getInputs } from './data/data.js'
    import { img2x, file2img } from './data/utils.js';
    // 定义类别数量（这里为3个品牌）
    const NUM_CLASSES = 3;
    // 品牌名称列表，对应预测结果的索引
    const BRAND_CLASSES = ['android', 'apple', 'windows'];
    window.onload = async function () {
      // 获取训练数据：图像元素和对应的标签
      const { inputs, labels } = await getInputs();
      // 在网页上可视化展示输入样本图像
      const surface = tfvis.visor().surface({ 
        name: '输入示例',
        styles: { height: 300 }, 
      })
      // 将每张图像添加到可视化区域中
      inputs.forEach(imgEl => {
        surface.drawArea.appendChild(imgEl);
      })

      // 加载模型
      const modelPath = './models/mobilenet_v3/model.json'
      const mobilenet = await tf.loadLayersModel(modelPath, { fromTFHub: false });
      // mobilenet.summary();
      // 获取 MobileNet 中指定层（conv_pw_13_relu）的输出
      const layer = mobilenet.getLayer('conv_pw_13_relu');
      // 截断 MobileNet，只保留前面的部分作为特征提取器
      const truncatedMobilenet = tf.model({
        inputs: mobilenet.inputs,
        outputs: layer.output,
      });
      // 构建新的迁移学习模型
      const model = tf.sequential();
      // 添加 Flatten 层，将卷积层输出展平
      model.add(tf.layers.flatten({ 
        inputShape: layer.outputShape.slice(1) 
      }))
      // 添加全连接层（Dense），激活函数为 ReLU
      model.add(tf.layers.dense({ 
        units: 10, 
        activation: 'relu' 
      }))
      // 输出层，有3个神经元（对应3个类别），使用 Softmax 激活函数
      model.add(tf.layers.dense({ 
        units: NUM_CLASSES, 
        activation: 'softmax' 
      }))
      // 编译模型，设置损失函数和优化器
      model.compile({
        loss: 'categoricalCrossentropy',
        optimizer: 'adam',
      })

      // 预处理训练数据：对每张图像提取特征并构建标签张量
      const { xs, ys } = tf.tidy(() => {
        // 对每张图像运行截断后的 MobileNet 提取特征
        const xs = tf.concat(inputs.map(imgEl=> truncatedMobilenet.predict(img2x(imgEl))));
        // 将标签转换为张量
        const ys = tf.tensor(labels);
        return { xs, ys };
      });
      // 模型训练
      await model.fit(xs, ys, { 
        epochs: 20,
        callbacks: tfvis.show.fitCallbacks({
            name: '训练效果'
        }, ['loss'], {
            callbacks: ['onEpochEnd']
        })
      });
      // 定义全局预测函数
      window.pridict = async function (file) {
        // 将用户上传的文件转为图片元素
        const img = await file2img(file);
        // 显示上传的图片
        document.body.appendChild(img);
        // 进行预测
        const pred = tf.tidy(() => {
          // 将图像转为张量格式
          const x = img2x(img);
          // 使用截断模型提取图像特征
          const input = truncatedMobilenet.predict(x);
          // 使用自定义的分类头进行预测
          return model.predict(input);
        });
        // 获取预测结果的最大概率对应的类别索引
        const index = pred.argMax(1).dataSync()[0];
        // 弹出提示框显示预测结果
        alert(`预测结果：${BRAND_CLASSES[index]}`);
      }
    }
  </script>
</body>
</html>
